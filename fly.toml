# Configuração de deploy no Fly.io para o backend EAD Umbanda.
# Usa o Dockerfile em server/Dockerfile (ffmpeg-static + meSpeak embutidos) e um
# VOLUME persistente montado em /data (banco SQLite + vídeos gerados).
#
# >>> TROQUE "app" por um nome único seu (ex.: umbanda-ead-seunome) <<<
app = "umbanda-ead"
primary_region = "gru"   # São Paulo (menor latência no Brasil). Ex. alternativos: "gig" (RJ)

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  DB_PATH = "/data/umbanda.db"
  UPLOADS_DIR = "/data/uploads"
  # CORS_ORIGIN deve ser a URL pública do próprio app (preencha após o 1º deploy):
  # CORS_ORIGIN = "https://umbanda-ead.fly.dev"

[http_service]
  internal_port = 4000
  force_https = true
  # auto_stop/start economiza: a máquina dorme quando ociosa e acorda nas requisições.
  # Mantemos min_machines_running = 1 para o WORKER de vídeo continuar processando a fila.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Volume persistente: preserva banco e vídeos entre deploys/reinícios.
[[mounts]]
  source = "umbanda_data"
  destination = "/data"

[[vm]]
  # 1 vCPU compartilhado + 512 MB: suficiente para backend + worker + ffmpeg leve.
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 4000
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
