name: Backend Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do servidor
        working-directory: server
        run: npm install
      - name: Rodar testes end-to-end do backend
        working-directory: server
        run: node --test
      - name: Build do frontend (verifica transpilação)
        working-directory: web
        run: npm install && npm run build
